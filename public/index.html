<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>News Terminal</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#252c36;--fg:#e6edf3;--mut:#8b949e;--up:#3fb950;--dn:#f85149;--acc:#58a6ff}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--panel:#fff;--line:#d8dee4;--fg:#1f2328;--mut:#656d76;--up:#1a7f37;--dn:#cf222e;--acc:#0969da}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
#strip{display:flex;gap:18px;overflow-x:auto;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;min-height:36px}
#strip b{font-weight:600;margin-right:6px}.up{color:var(--up)}.dn{color:var(--dn)}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
#q{flex:1;min-width:160px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:14px}
#chips{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:12px;user-select:none;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#meta{color:var(--mut);font-size:12px;width:100%}
#list{max-width:1100px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.row{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.row:hover{background:var(--panel)}.row.new{animation:fl 3s ease-out}
@keyframes fl{from{background:rgba(88,166,255,.25)}to{background:transparent}}
.t{color:var(--mut);font-size:12px;min-width:34px;font-variant-numeric:tabular-nums}
.s{color:var(--mut);font-size:12px;min-width:110px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a{color:var(--fg);text-decoration:none;flex:1}a:visited{color:var(--mut)}a:hover{color:var(--acc)}
.tg{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--line);color:var(--mut);margin-left:4px;white-space:nowrap}
@media(max-width:640px){.s{display:none}}
</style></head><body>
<div id="strip">loading prices…</div>
<div id="bar"><input id="q" placeholder="Search (TTF, storage, OPEC…)" autocomplete="off">
<div id="chips"></div><span id="meta"></span></div>
<div id="list"></div>
<script>
"use strict";
const TAGRX={
 OIL:/\b(oil|brent|wti|crude|opec|refiner\w*|barrels?)\b/i,
 GAS:/\b(natural gas|lng|ttf|nbp|henry hub|gas prices?|gas storage|pipeline)\b/i,
 POWER:/\b(power prices?|electricity|grid|utilit\w+|renewables?|solar|wind|battery|batteries|hydrogen|electroly\w+|ppa|nuclear)\b/i,
 CARBON:/\b(carbon|eua|ets|emissions?)\b/i,
 MACRO:/\b(fed|ecb|boe|inflation|rate cuts?|interest rates?|gdp|treasury|yields?|dollar|recession|tariffs?)\b/i,
 MARKETS:/\b(stocks?|shares|s&p|nasdaq|dow|ftse|dax|earnings)\b/i};
const FILTERS=["ALL",...Object.keys(TAGRX)];
const MAXKEEP=400;
const $=id=>document.getElementById(id);
const items=new Map(), titles=new Set(), status={};
let FEEDS=[], tag="ALL", term="", pending=false;

const norm=t=>t.toLowerCase().replace(/[^a-z0-9]+/g," ").trim().slice(0,90);
const dec=document.createElement("textarea");
function text(s){const x=(s||"").replace(/<[^>]+>/g,"");dec.innerHTML=x;return dec.value.replace(/\s+/g," ").trim();}
function ago(ts){const s=Math.max(0,Date.now()/1000-ts);
 if(s<60)return Math.floor(s)+"s";if(s<3600)return Math.floor(s/60)+"m";
 if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d";}

function parseXML(xml,feedName){
 const doc=new DOMParser().parseFromString(xml,"text/xml");
 if(doc.querySelector("parsererror"))return [];
 const out=[];
 doc.querySelectorAll("item, entry").forEach(n=>{
  const kids=[...n.children];
  const get=(...names)=>{for(const nm of names){const e=kids.find(c=>c.localName===nm);
   if(!e)continue; if(nm==="link"&&e.getAttribute("href"))return e.getAttribute("href");
   const t=(e.textContent||"").trim(); if(t)return t;} return "";};
  let title=text(get("title")); const link=get("link","guid");
  if(!title||!/^https?:/i.test(link))return;
  if(feedName.startsWith("GN:"))title=title.replace(/\s+-\s+[^-]{2,40}$/,"");
  let ts=Date.parse(get("pubDate","published","updated","date"))/1000;
  const now=Date.now()/1000; if(!isFinite(ts))ts=now; ts=Math.min(ts,now);
  out.push({id:link,title,link,source:get("source")||feedName,ts});
 });
 return out;
}

function add(i,live){
 const nt=norm(i.title);
 if(items.has(i.id)||titles.has(nt))return;
 i.tags=Object.keys(TAGRX).filter(k=>TAGRX[k].test(i.title));
 i.seen=Date.now(); i.live=live;
 items.set(i.id,i); titles.add(nt); schedule();
}
function matches(i){return (tag==="ALL"||i.tags.includes(tag))&&(!term||(i.title+" "+i.source).toLowerCase().includes(term));}
function row(i){
 const d=document.createElement("div");d.className="row"+(i.live&&Date.now()-i.seen<3000?" new":"");
 const t=document.createElement("span");t.className="t";t.textContent=ago(i.ts);
 const s=document.createElement("span");s.className="s";s.textContent=i.source;
 const a=document.createElement("a");a.href=i.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent=i.title;
 i.tags.slice(0,3).forEach(x=>{const g=document.createElement("span");g.className="tg";g.textContent=x;a.appendChild(g);});
 d.append(t,s,a);return d;}
function render(){
 pending=false;
 const arr=[...items.values()].filter(matches).sort((a,b)=>b.ts-a.ts).slice(0,300);
 const f=document.createDocumentFragment();arr.forEach(i=>f.appendChild(row(i)));
 $("list").replaceChildren(f);
 const names=Object.keys(status), ok=names.filter(n=>status[n]).length, bad=names.filter(n=>!status[n]);
 $("meta").textContent=arr.length+" shown · "+items.size+" stored · "+ok+"/"+FEEDS.length+" feeds live"+(bad.length?" (down: "+bad.join(", ")+")":"");
}
function schedule(){if(!pending){pending=true;requestAnimationFrame(render);}}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{
 localStorage.setItem("nt_items",JSON.stringify([...items.values()].sort((a,b)=>b.ts-a.ts).slice(0,MAXKEEP)
  .map(({id,title,link,source,ts})=>({id,title,link,source,ts}))));}catch(e){}},1500);}

let firstRound=true;
async function pull(f){
 try{
  const r=await fetch("/api/feed?id="+encodeURIComponent(f.id),{cache:"no-store"});
  if(!r.ok)throw new Error(r.status);
  const list=parseXML(await r.text(),f.name);
  list.forEach(i=>add(i,!firstRound&&!f.first));
  f.first=false; status[f.name]=list.length>0; save();
 }catch(e){status[f.name]=false;}
 schedule();
}
function loop(f){
 const go=async()=>{ if(!document.hidden)await pull(f);
  setTimeout(go,f.every*1000+Math.random()*3000);};
 go();
}
async function quotes(){
 if(document.hidden)return;
 try{const q=await (await fetch("/api/quotes")).json(); if(!q.length)return;
 $("strip").replaceChildren(...q.map(x=>{const s=document.createElement("span");const c=x.chg>=0?"up":"dn";
  s.innerHTML="<b></b><span></span> <span class='"+c+"'></span>";
  s.children[0].textContent=x.label;
  s.children[1].textContent=x.price.toLocaleString(undefined,{maximumFractionDigits:3});
  s.children[2].textContent=(x.chg>=0?"▲ ":"▼ ")+Math.abs(x.pct).toFixed(2)+"%";return s;}));}catch(e){}}

FILTERS.forEach(t=>{const c=document.createElement("span");c.className="chip"+(t==="ALL"?" on":"");c.textContent=t;
 c.onclick=()=>{tag=t;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));schedule();};$("chips").appendChild(c);});
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();schedule();};

(async function init(){
 // 1) instant paint from the last visit
 try{JSON.parse(localStorage.getItem("nt_items")||"[]").forEach(i=>add(i,false));}catch(e){}
 // 2) fetch feed list, then poll every feed on its own timer
 try{FEEDS=await (await fetch("/api/feeds")).json();}catch(e){$("meta").textContent="offline - showing saved headlines";return;}
 FEEDS.forEach(f=>{f.first=true;loop(f);});
 setTimeout(()=>{firstRound=false;},8000);
 quotes();setInterval(quotes,20000);setInterval(schedule,30000);
 // catch up immediately when you reopen the app
 document.addEventListener("visibilitychange",()=>{if(!document.hidden){FEEDS.forEach(pull);quotes();}});
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
